
<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Library Management System</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#books">Books</a>
        <a href="#issue">Issue Book</a>
    </nav>

    <h3 id="books">Available Books</h3>

    <table>
        <tr>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Author</th>
        </tr>
        <tr>
            <td>101</td>
            <td>HTML Basics</td>
            <td>John</td>
        </tr>
        <tr>
            <td>102</td>
            <td>CSS Basics</td>
            <td>Smith</td>
        </tr>
        <tr>
            <td>103</td>
            <td>JavaScript</td>
            <td>David</td>
        </tr>
    </table>

    <h3 id="issue">Book Issue Form</h3>

    <form>
        Student Name:
        <input type="text" placeholder="Enter name" required>

        Roll Number:
        <input type="text" placeholder="Enter roll number" required>

        Email:
        <input type="email" placeholder="Enter email" required>

        Select Book:
        <select>
            <option>HTML Basics</option>
            <option>CSS Basics</option>
            <option>JavaScript</option>
        </select>

        <input type="submit" value="Issue Book">
    </form>

</body>
</html>
